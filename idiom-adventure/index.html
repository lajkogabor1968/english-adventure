join('');if(mode===0){if(i>=D.length){out.innerHTML='<h2>Vocabulary complete</h2><button onclick="go(1)">Continue →</button>';return}const d=D[i];out.innerHTML='<p>'+(i+1)+' / 20</p><h2>'+d[1]+'</h2><button onclick="speak(D[i][1])">Listen</button><p>'+d[4]+'</p><p>'+d[3]+'</p><details><summary>Hungarian meaning</summary>'+d[2]+'</details><button onclick="if(i>0){i--;render()}" '+(i===0?'disabled':'')+'>Previous</button><button onclick="next()">Next →</button>'}else if(mode===1){out.innerHTML='<h2>Idioms in context</h2>'+D.map((d,j)=>'<article><strong>'+d[3]+'</strong><button onclick="speak(D['+j+'][3])">Listen</button><details><summary>Meaning</summary>'+d[2]+'</details></article>').join('')+'<button onclick="go(2)">Continue →</button>'}else if(mode===2){if(i>=10)return finish(10);quiz(D[order[i]][4],order[i],10)}else if(mode===3){if(i>=20)return finish(20);const j=order[i],c=C[j];out.innerHTML='<p>Question '+(i+1)+' / 20 · Score: '+score+'</p><progress value="'+i+'" max="20"></progress><h2>'+c[0]+'</h2><form id="fill"><input id="entry" aria-label="Missing word" autocomplete="off" required placeholder="Type the missing word"><button id="check">Check</button></form><p id="feedback" role="status"></p><button id="next" hidden onclick="next()">Next →</button>';document.getElementById('fill').onsubmit=e=>{e.preventDefault();const v=document.getElementById('entry').value.trim().toLowerCase().replace(/\s+/g,' ');feedback(c[1].split('|').includes(v),c[1].replace('|',' / ')+' — '+D[j][2])}}else if(mode===4){if(i>=Math.min(12,S.length))return finish(Math.min(12,S.length));const s=S[order[i]];quiz(s[0],s[1],Math.min(12,S.length))}else if(mode===5){out.innerHTML='<h2>Independent writing</h2><p>Write a sentence of your own, then compare it with the model. There can be several correct answers.</p>'+W.map((w,j)=>'<article><p>'+w[0]+'</p><textarea rows="3" aria-label="Your answer '+(j+1)+'" id="w'+j+'"></textarea><details><summary>Model answer</summary>'+w[1]+'</details></article>').join('')+'<button onclick="go(6)">Review →</button>';W.forEach((w,j)=>{const a=document.getElementById('w'+j);a.value=drafts[j]||'';a.oninput=()=>drafts[j]=a.value})}else{out.innerHTML='<h2>Your results</h2>'+[2,3,4].map(j=>'<p>'+tabs[j]+': '+(results[j]?results[j].join(' / '):'Not completed')+'</p>').join('')+'<p>Written responses: '+Object.values(drafts).filter(x=>x.trim()).length+' / '+W.length+' (self-assessment)</p><h3>Vocabulary recap</h3>'+D.map(d=>'<details><summary>'+d[1]+'</summary>'+d[2]+' — '+d[3]+'</details>').join('')+'<button onclick="go(2)">Practise again</button>'}}function choosePack(n){const p=PACKS[Number(n)];D=p.d;C=p.c;S=p.s;W=p.w;results={};drafts={};go(0)}choosePack(0);</script></html>
