let mode=0,i=0,score=0,locked=false,order=[],results={},drafts={};const out=document.getElementById('out');function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function go(m){mode=m;i=0;score=0;locked=false;order=shuffle(D.map((_,j)=>j));if(m===4)order=shuffle(S.map((_,j)=>j));render()}function next(){i++;locked=false;render()}function speak(t){if(!window.speechSynthesis){alert('Audio is unavailable on this device.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}function finish(n){results[mode]=[score,n];out.innerHTML='<h2>Result: '+score+' / '+n+'</h2><p>'+Math.round(score/n*100)+'%</p><button onclick="go(mode)">Try again</button><button onclick="go(mode+1)">Continue →</button>'}function feedback(ok,answer){if(locked)return;locked=true;if(ok)score++;const f=document.getElementById('feedback');f.className=ok?'good':'bad';f.textContent=(ok?'Correct. ':'Correct answer: ')+answer;out.querySelectorAll('.options button,#check,#entry').forEach(b=>b.disabled=true);document.getElementById('next').hidden=false}function quiz(prompt,j,n){const d=D[j];out.innerHTML='<p>Question '+(i+1)+' / '+n+' · Score: '+score+'</p><progress value="'+i+'" max="'+n+'"></progress><h2>'+prompt+'</h2><div class="options"></div><p id="feedback" role="status"></p><button id="next" hidden onclick="next()">Next →</button>';shuffle([j,...shuffle(D.map((_,k)=>k).filter(k=>k!==j&& !( [7,10].includes(j)&&[7,10].includes(k)))).slice(0,3)]).forEach(k=>{const b=document.createElement('button');b.textContent=D[k][1];b.onclick=()=>feedback(k===j,d[1]+' — '+d[2]+'. '+d[3]);out.querySelector('.options').append(b)})}function render(){document.getElementById('nav').innerHTML=tabs.map((t,j)=>'<button class="'+(j===mode?'active':'')+'" onclick="go('+j+')">'+t+'</button>').join('');if(mode===0){if(i>=D.length){out.innerHTML='<h2>Vocabulary complete</h2><button onclick="go(1)">Continue →</button>';return}const d=D[i];out.innerHTML='<p>'+(i+1)+' / 20</p><h2>'+d[1]+'</h2><button onclick="speak(D[i][1])">Listen</button><p>'+d[4]+'</p><p>'+d[3]+'</p><details><summary>Hungarian meaning</summary>'+d[2]+'</details><button onclick="if(i>0){i--;render()}" '+(i===0?'disabled':'')+'>Previous</button><button onclick="next()">Next →</button>'}else if(mode===1){out.innerHTML='<h2>Idioms in context</h2>'+D.map((d,j)=>'<article><strong>'+d[3]+'</strong><button onclick="speak(D['+j+'][3])">Listen</button><details><summary>Meaning</summary>'+d[2]+'</details></article>').join('')+'<button onclick="go(2)">Continue →</button>'}else if(mode===2){if(i>=10)return finish(10);quiz(D[order[i]][4],order[i],10)}else if(mode===3){if(i>=20)return finish(20);const j=order[i],c=C[j];out.innerHTML='<p>Question '+(i+1)+' / 20 · Score: '+score+'</p><progress value="'+i+'" max="20"></progress><h2>'+c[0]+'</h2><form id="fill"><input id="entry" aria-label="Missing word" autocomplete="off" required placeholder="Type the missing word"><button id="check">Check</button></form><p id="feedback" role="status"></p><button id="next" hidden onclick="next()">Next →</button>';document.getElementById('fill').onsubmit=e=>{e.preventDefault();const v=document.getElementById('entry').value.trim().toLowerCase().replace(/\s+/g,' ');feedback(c[1].split('|').includes(v),c[1].replace('|',' / ')+' — '+D[j][2])}}else if(mode===4){if(i>=S.length)return finish(S.length);const s=S[order[i]];quiz(s[0],s[1],S.length)}else if(mode===5){out.innerHTML='<h2>Independent writing</h2><p>Write a sentence of your own, then compare it with the model. There can be several correct answers.</p>'+W.map((w,j)=>'<article><p>'+w[0]+'</p><textarea rows="3" aria-label="Your answer '+(j+1)+'" id="w'+j+'"></textarea><details><summary>Model answer</summary>'+w[1]+'</details></article>').join('')+'<button onclick="go(6)">Review →</button>';W.forEach((w,j)=>{const a=document.getElementById('w'+j);a.value=drafts[j]||'';a.oninput=()=>drafts[j]=a.value})}else{out.inner
