<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idiom Adventure · B1</title><style>*{box-sizing:border-box}body{margin:0;background:#101a32;color:#f4f7ff;font:18px system-ui}main{max-width:850px;margin:auto;padding:20px}section,article{background:#203453;border:1px solid #476187;border-radius:20px;padding:22px;margin:16px 0}h1{font-size:clamp(30px,6vw,50px);margin:10px 0}button,a{font:inherit}button{background:#f9ce67;color:#152039;border:0;border-radius:12px;padding:12px 18px;margin:5px;cursor:pointer;font-weight:700;min-height:48px}button:disabled{opacity:.65}button:focus-visible,a:focus-visible{outline:3px solid white}a{color:#a8e2ff}nav{display:flex;flex-wrap:wrap}nav button{background:#8ec9e7}nav button.active{background:#f9ce67}#emoji{font-size:64px;text-align:center}#out{min-height:240px}p{line-height:1.5}.muted{color:#c2d4ef}.good{color:#9cf1bd}.bad{color:#ffd2a8}.options{display:grid;gap:7px}.options button{text-align:left}textarea,input{width:100%;font:inherit;padding:12px;border-radius:10px}details{margin:10px 0}summary{cursor:pointer;padding:10px}progress{width:100%;accent-color:#f9ce67}</style><main><a href="../">← English Adventure</a><header><p class="muted">ENGLISH ADVENTURE • B1 • 45 MIN</p><h1>🎭 Idiom Adventure</h1><p>English is more than words! Learn, laugh, play and speak.</p></header><nav id="nav"></nav><section id="out" aria-live="polite"></section><p class="muted">No account needed. Scores are local to this session. Speaking and open answers are checked by classmates or the teacher.</p></main><script>
const D=[["🍎👁️","the apple of my eye","a szemem fénye","My daughter is the apple of my eye.","someone I love very much"],["☕","not my cup of tea","nem az én világom","Football is not my cup of tea.","something I do not enjoy"],["🐴","my hobbyhorse","a vesszőparipám","Grammar is my hobbyhorse.","a favourite topic I often talk about"],["🍰","a piece of cake","gyerekjáték","The test was a piece of cake.","very easy"],["🧊","break the ice","oldani a feszültséget","I told a joke to break the ice.","help people relax and start talking"],["🌧️🤒","under the weather","rosszul érzi magát","I feel under the weather today.","feeling slightly ill"],["🛋️🥔","a couch potato","kanapén lustálkodó ember","My brother is a couch potato.","a lazy person who watches a lot of TV"],["🫘","spill the beans","elárulni a titkot","Come on! Spill the beans!","reveal a secret"],["🐎✋","hold your horses","csak lassan!","Hold your horses! I'm not ready.","wait and be patient"],["🐷🪽","when pigs fly","majd ha piros hó esik","I'll buy you a castle when pigs fly.","never"],["🐈👜","let the cat out of the bag","kikotyogni a titkot","She let the cat out of the bag.","reveal a secret, often accidentally"],["☁️9️⃣","on cloud nine","a fellegekben jár","She was on cloud nine after the exam.","extremely happy"],["💸","cost an arm and a leg","egy vagyonba kerül","These shoes cost an arm and a leg.","be very expensive"],["🌕","once in a blue moon","nagyon ritkán","I eat fast food once in a blue moon.","very rarely"],["🐟🏜️","a fish out of water","idegenül érzi magát","I felt like a fish out of water at the party.","someone who feels out of place"],["🐦🐦🪨","kill two birds with one stone","két legyet ütni egy csapásra","I can exercise and walk the dog to kill two birds with one stone.","achieve two things with one action"],["🐱🐶🌧️","it's raining cats and dogs","szakad az eső","Take an umbrella! It's raining cats and dogs.","it is raining very heavily"],["🧀","a big cheese","fontos ember","He's a big cheese in the company.","an important person"],["🦵","pull someone's leg","ugratni valakit","Are you pulling my leg?","joke with someone by making them believe something false"],["🥶🦶","get cold feet","elbizonytalanodni, megijedni","He got cold feet before the competition.","become too nervous to do something"]];const tabs=['Learn · 10 min','Picture quiz · 5 min','Examples · 5 min','Challenge · 8 min','Dialogues · 7 min','Activity · 7 min','Talk · 3 min'];let mode=0,i=0,score=0,done=false,teams=[0,0],revealed=false,order=[];const out=document.getElementById('out');function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function go(m){mode=m;i=0;score=0;done=false;revealed=false;order=shuffle(D.slice());render()}function next(){i++;done=false;revealed=false;render()}function speak(t){if(!window.speechSynthesis){alert('Read the sentence aloud.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}function render(){document.getElementById('nav').innerHTML=tabs.map((t,j)=>'<button class="'+(j===mode?'active':'')+'" onclick="go('+j+')">'+t+'</button>').join('');let d=(mode===0?D:order)[i];if(mode===0){if(i===D.length){out.innerHTML='<h2>Well done!</h2><button onclick="go(1)">Picture quiz →</button>';return}out.innerHTML='<p>'+ (i+1)+' / 20</p><div id="emoji">'+d[0]+'</div><h2>'+d[1]+'</h2><button onclick="speak(D[i][1])">🔊 Listen</button><details><summary>Show meaning / Jelentés</summary><p>'+d[2]+' · '+d[4]+'</p><p>'+d[3]+'</p></details><button onclick="if(i>0){i--;render()}" '+(i===0?'disabled':'')+'>← Back</button><button onclick="next()">Next →</button>'}else if(mode===1||mode===3){let n=mode===1?6:10;if(i>=n){out.innerHTML='<h2>Result: '+score+' / '+n+'</h2><button onclick="go(mode)">Try again</button><button onclick="go(mode+1)">Continue →</button>';return}let pool=shuffle([d,...shuffle(D.filter(x=>x!==d)).slice(0,3)]);out.innerHTML='<p>Question '+(i+1)+' / '+n+' · Score: '+score+'</p><progress value="'+i+'" max="'+n+'"></progress><h2>'+(mode===1?'Guess the idiom!':'Choose the idiom that matches the meaning.')+'</h2><div id="emoji">'+(mode===1?d[0]:'')+'</div><p>'+(mode===3?d[4]:'')+'</p><div class="options" id="opts"></div><p id="feedback" role="status"></p><button id="next" hidden onclick="next()">Next →</button>';pool.forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(done)return;done=true;if(x===d)score++;document.querySelectorAll('#opts button').forEach(y=>y.disabled=true);let f=document.getElementById('feedback');f.className=x===d?'good':'bad';f.textContent=(x===d?'Correct! ':'Correct answer: ')+d[1]+' — '+d[2]+'. '+d[3];document.getElementById('next').hidden=false};document.getElementById('opts').append(b)})}else if(mode===2){out.innerHTML='<h2>Idioms in context</h2>'+D.map((x,j)=>'<article><strong>'+x[3]+'</strong><button onclick="speak(D['+j+'][3])">🔊</button><details><summary>Meaning</summary>'+x[2]+'</details></article>').join('')}else if(mode===4){out.innerHTML='<h2>Pair work</h2><p>Read, swap roles, then invent your own dialogue.</p>'+[['How was your test?','A piece of cake!','Really? Are you pulling my leg?'],['Can you clean your room?','When pigs fly!','Don’t be such a couch potato!'],['I have some exciting news.','Spill the beans!','I passed my exam. I’m on cloud nine!'],['Do you like this jacket?','Not my cup of tea.','And it costs an arm and a leg!'],['Why are you so quiet?','I feel like a fish out of water.','Let’s play a game to break the ice.']].map((a,j)=>'<article><h3>Dialogue '+(j+1)+'</h3>'+a.map((s,k)=>'<p>'+(k%2?'B':'A')+': '+s+'</p>').join('')+'</article>').join('')+'<textarea rows="4" aria-label="Your dialogue" placeholder="Write your own dialogue…"></textarea>'}else if(mode===5){d=order[i%order.length];out.innerHTML='<h2>Draw or mime!</h2><p>Only the performer should see the card. No speaking or writing words while miming.</p><h3>'+(revealed?d[1]:'🔒 Secret card')+'</h3><button onclick="revealed=!revealed;render()">'+(revealed?'Hide':'Reveal')+'</button><button onclick="next()">Next card</button><article>Team A: '+teams[0]+' <button onclick="teams[0]++;render()">+1</button><button onclick="teams[0]=Math.max(0,teams[0]-1);render()">−1</button><br>Team B: '+teams[1]+' <button onclick="teams[1]++;render()">+1</button><button onclick="teams[1]=Math.max(0,teams[1]-1);render()">−1</button></article>'}else{out.innerHTML='<h2>Let’s talk!</h2>'+['Who is the apple of your eye?','What is not your cup of tea?','Are you sometimes a couch potato?','When were you last on cloud nine?','What costs an arm and a leg?','What subject is a piece of cake for you?','What do you do once in a blue moon?'].map(t=>'<p>💬 '+t+'</p>').join('')+'<p>Use at least three idioms in your answers.</p><button onclick="go(0)">Practise again</button>'}}go(0);
